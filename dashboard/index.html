<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEL Conformity Audit - PC-12 HB-FVT</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': {
                            700: '#1e3a5f',
                            800: '#152a45',
                            900: '#0d1b2a',
                        },
                        'aviation': {
                            blue: '#1e3a5f',
                            orange: '#ff6b35',
                            green: '#10b981',
                            red: '#ef4444',
                            yellow: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .gauge-container {
            position: relative;
            width: 200px;
            height: 100px;
            overflow: hidden;
        }

        .gauge-bg {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                from 180deg,
                #ef4444 0deg,
                #f59e0b 90deg,
                #10b981 180deg
            );
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
        }

        .gauge-inner {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #0d1b2a;
        }

        .gauge-needle {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom center;
            width: 4px;
            height: 70px;
            background: white;
            border-radius: 2px;
            margin-left: -2px;
            transition: transform 0.5s ease-out;
        }

        .modal-backdrop {
            backdrop-filter: blur(4px);
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: #1e3a5f;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #3b5998;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-navy-900 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel" src="src/AuditDashboard.jsx"></script>
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuditDashboard />);
    </script>
</body>
</html>
