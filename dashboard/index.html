<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEL/MMEL Audit Dashboard - PC-12</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': {
                            600: '#2d4a6f',
                            700: '#1e3a5f',
                            800: '#152a45',
                            900: '#0d1b2a',
                            950: '#080f17',
                        },
                        'aviation': {
                            blue: '#1e3a5f',
                            orange: '#ff6b35',
                            green: '#10b981',
                            red: '#ef4444',
                            yellow: '#f59e0b',
                            cyan: '#06b6d4',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        * {
            scrollbar-width: thin;
            scrollbar-color: #3b5998 #152a45;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #152a45;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b5998;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a69bd;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Gauge styles */
        .gauge-container {
            position: relative;
            width: 180px;
            height: 90px;
            overflow: hidden;
        }

        .gauge-bg {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(
                from 180deg,
                #ef4444 0deg,
                #f59e0b 60deg,
                #fbbf24 90deg,
                #10b981 150deg,
                #059669 180deg
            );
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
        }

        .gauge-inner {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 144px;
            height: 144px;
            border-radius: 50%;
            background: linear-gradient(135deg, #152a45 0%, #0d1b2a 100%);
        }

        .gauge-needle {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom center;
            width: 3px;
            height: 60px;
            background: linear-gradient(to top, #ff6b35, #fbbf24);
            border-radius: 2px;
            margin-left: -1.5px;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }

        .gauge-center {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background: #ff6b35;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }

        /* Chat styles */
        .chat-message {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator span {
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Tab transition */
        .tab-content {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Card hover effects */
        .card-hover {
            transition: all 0.2s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Modal backdrop */
        .modal-backdrop {
            backdrop-filter: blur(8px);
        }

        /* Progress bar animation */
        .progress-bar {
            background: linear-gradient(90deg, #10b981, #06b6d4, #10b981);
            background-size: 200% 100%;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Pulse animation for status indicators */
        .pulse-green {
            animation: pulseGreen 2s infinite;
        }

        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
        }

        /* Glass effect */
        .glass {
            background: rgba(21, 42, 69, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-navy-950 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel" src="src/App.jsx"></script>
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
