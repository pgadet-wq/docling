# IOSA Document Parser - Docker Compose
# ======================================
#
# Usage:
#   docker-compose -f docker-compose.iosa.yml up -d
#
# With GPU:
#   docker-compose -f docker-compose.iosa.yml --profile gpu up -d

version: '3.8'

services:
  # Main IOSA Parser Service
  iosa-parser:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.iosa
    image: iosa-parser:latest
    container_name: iosa-parser
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - iosa-cache:/app/cache
      - iosa-data:/app/data
      - iosa-output:/app/output
      - ./models:/app/models:ro
    environment:
      - IOSA_DEVICE=cuda
      - IOSA_BATCH_SIZE=4
      - IOSA_TABLE_MODE=hybrid
      - IOSA_ENABLE_OCR=true
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # CPU-only version (alternative)
  iosa-parser-cpu:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.iosa
    image: iosa-parser:latest
    container_name: iosa-parser-cpu
    restart: unless-stopped
    profiles:
      - cpu
    ports:
      - "8000:8000"
    volumes:
      - iosa-cache:/app/cache
      - iosa-data:/app/data
      - iosa-output:/app/output
    environment:
      - IOSA_DEVICE=cpu
      - IOSA_BATCH_SIZE=1
      - IOSA_TABLE_MODE=standard
      - IOSA_ENABLE_OCR=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: iosa-redis
    restart: unless-stopped
    profiles:
      - with-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: iosa-nginx
    restart: unless-stopped
    profiles:
      - with-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - iosa-parser

  # Prometheus metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: iosa-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Grafana dashboard (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: iosa-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  iosa-cache:
    driver: local
  iosa-data:
    driver: local
  iosa-output:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: iosa-network
